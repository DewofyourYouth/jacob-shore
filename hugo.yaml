build:
  buildStats:
    enable: true
  cachebusters:
    - source: "assets/notwatching/hugo_stats\\.json"
      target: "css"
    - source: "(postcss|tailwind)\\.config\\.js"
      target: "css"

module:
  mounts:
    - source: "assets"
      target: "assets"
    - disableWatch: true
      source: "hugo_stats.json"
      target: "assets/notwatching/hugo_stats.json"

security:
  # Hugo's default exec allowlist plus tailwindcss, which css.TailwindCSS shells
  # out to (scripts/build_css.sh / the pre-push hook). Hugo >= 0.167 dropped it
  # from the defaults.
  exec:
    allow: ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']
  http:
    methods: ["GET"]
    urls:
      - "https://dailyderja.com/"
      - "https://dailyderja.com/index.json"
      - "https://turk-defter.com/"
      - "https://turk-defter.com/index.json"
      - "https://dewofyouryouth.com/"
      - "https://dewofyouryouth.com/index.json"
      - "https://www.dewofyouryouth.com/"
      - "https://www.dewofyouryouth.com/index.json"

# Always refetch remote feeds, so a deploy-hook rebuild (triggered when Dew of
# Your Youth / Daily Derja publish) never serves a cached copy of their index.json.
caches:
  getresource:
    maxAge: 0
